.brand{display:flex;align-items:center;gap:11px}

.brand b{font-size:14px;font-weight:800;display:block;line-height:1.2}
.brand small{font-size:11px;color:var(--muted);display:block;line-height:1.2}
.header-actions{display:flex;align-items:center;gap:8px}
.head-btn,.mini-tag{font-size:12.5px;white-space:nowrap;color:var(--muted)}
.head-btn{transition:color .2s;padding:4px 2px}
.head-btn:hover{color:var(--ink)}
.header-actions{gap:18px}


/* top */
main{padding-top:56px;padding-bottom:40px}
.top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;align-items:center}
.top>*{min-width:0}
.eyebrow{font-size:13px;color:var(--muted);overflow-wrap:anywhere}


h1{font-size:clamp(34px,5vw,62px);font-weight:900;line-height:1.08;margin:20px 0 16px;overflow-wrap:anywhere}
.lead{font-size:clamp(17px,1.9vw,21px);font-weight:700;line-height:1.4;color:var(--ink);max-width:36em;overflow-wrap:anywhere}
.sublead{font-size:15px;color:var(--muted);margin-top:8px;max-width:44em;overflow-wrap:anywhere}




.top-media{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px}
.source-img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:15px;display:block;background:#fff;padding:7%}
.img-missing{display:grid;place-items:center;text-align:center;color:var(--faint);font-size:11px;background:var(--well);border-radius:12px;padding:8px}
.top-media .img-missing{aspect-ratio:1;font-size:30px;border-radius:15px}



/* bento */
.bento{display:flex;margin-top:52px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{flex:1;min-width:0;padding:22px 0 20px;padding-inline-start:24px;border-inline-start:1px solid var(--line)}
.cell:first-child{padding-inline-start:0;border-inline-start:0}
.cell .n{font-size:clamp(28px,3.6vw,46px);font-weight:800;line-height:1.05;direction:ltr;text-align:right}
.cell .l{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4;padding-inline-end:16px}





/* results */
.results-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:56px 0 18px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:22px;font-weight:800;}
.count{font-size:15px;font-weight:500;color:var(--faint);letter-spacing:0}
.filters{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0;max-width:100%}
.seg{display:inline-flex;background:#efedea;border-radius:11px;padding:3px;gap:2px}
.chip{font-size:12.5px;color:var(--muted);padding:6px 13px;border-radius:8px;white-space:nowrap;transition:color .15s}
.chip:hover{color:var(--ink)}
.chip.active{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 2px #0000001a}
.filters select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:12.5px;color:var(--ink2)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--sh);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s;animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.card:hover{transform:translateY(-3px);border-color:#d6d3d0;box-shadow:0 1px 2px #0000000a,0 18px 36px -16px #00000026}
.card.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--sh)}
.pick-ribbon{background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;padding:6px 14px;text-align:center;letter-spacing:.01em}
.image-well{aspect-ratio:4/3;background:var(--well);margin:6px 6px 0;border-radius:11px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.image-well img{width:82%;height:82%;object-fit:contain;mix-blend-mode:multiply}
.image-well .img-missing{width:100%;height:100%}
.favorite{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:50%;background:#ffffffd9;border:1px solid var(--line);color:var(--ink2);font-size:15px;line-height:1;z-index:1;backdrop-filter:blur(6px);transition:transform .15s}
.favorite:hover{transform:scale(1.08)}
.favorite.saved{background:var(--accent);border-color:var(--accent);color:#fff}
.match{position:absolute;right:10px;top:10px;font-size:11px;background:#ffffffe6;border-radius:6px;padding:2px 8px;z-index:1;color:var(--ink2)}
.match.exact{color:#3f6212}
.match.unconfirmed{color:#9a3412}
.card-body{padding:14px 16px 16px;display:flex;flex-direction:column;flex:1;min-width:0}
.store{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.store span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:700;color:var(--ink2)}
.avail{font-size:10.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.avail::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.avail.in{color:#4d7c0f}.avail.out{color:var(--bad)}.avail.unknown{color:var(--faint)}
.card h3{font-size:15px;line-height:1.4;margin:8px 0 2px;font-weight:700;overflow-wrap:anywhere}
.spec{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.price{font-size:30px;font-weight:800;line-height:1.1;margin-top:auto;padding-top:16px;direction:ltr;text-align:right}
.price.none{font-size:15px;letter-spacing:0;direction:rtl;color:var(--muted)}
.shipping{font-size:11.5px;color:var(--muted);min-height:36px;margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.shipping b{color:var(--ink);font-weight:700;display:block}
.card-actions{display:flex;gap:6px;margin-top:12px}
.shop{flex:1;text-align:center;background:var(--ink);color:#fff;border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:700;transition:background .2s}
.shop:hover{background:#2a2a2e}
.detail{border:1px solid var(--line);border-radius:10px;padding:0 13px;font-size:12.5px;color:var(--ink2);transition:border-color .2s}
.detail:hover{border-color:var(--ink)}
.notice{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.7;max-width:70em}
.empty{grid-column:1/-1;border:1px dashed #d6d3d0;text-align:center;border-radius:var(--r);padding:48px 20px}
.empty h3{font-size:18px;font-weight:800;margin:0 0 4px}
.empty p{color:var(--muted);font-size:13px}
.primary{background:var(--ink);color:#fff;padding:10px 20px;border-radius:10px;font-weight:700;font-size:13px;display:inline-block;transition:background .2s}
.primary:hover{background:#2a2a2e}
.empty .primary{margin-top:14px}

/* piles */










footer{display:flex;justify-content:space-between;gap:15px;margin-top:56px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--faint)}

/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;padding:26px;width:460px;max-width:92vw;max-height:88vh;color:var(--ink);box-shadow:0 30px 80px -20px #00000059;font:inherit}
dialog::backdrop{background:#0c0c0d59;backdrop-filter:blur(6px)}

dialog h2{font-size:22px;font-weight:800;margin:10px 0 8px;line-height:1.25;overflow-wrap:anywhere}
dialog p{font-size:13.5px;color:var(--ink2);margin:6px 0;overflow-wrap:anywhere}
dialog dl{margin:16px 0 0;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:0;border-top:1px solid var(--line)}
dialog dt,dialog dd{padding:8px 0;border-bottom:1px solid var(--line)}
dialog dt{color:var(--muted);padding-left:18px}
dialog dd{margin:0;overflow-wrap:anywhere}
dialog ul{margin:6px 0 0;padding-right:18px;font-size:12.5px;color:var(--muted);line-height:1.7}
.close{background:var(--well);border-radius:50%;width:28px;height:28px;float:left;font-size:12px}
dialog .primary{display:block;text-align:center;margin-top:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;z-index:10;font-size:13px;box-shadow:0 14px 40px -10px #00000066;max-width:90vw;text-align:center}

/* ---- intro show ---- */
body.intro-on{overflow:hidden}
body.film .in-skip,body.film .in-snd,body.film .header-actions{display:none}
#intro{--accent:#ffd9b3;position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#17040a 0%,#2b0710 52%,#12030a 100%);color:#fff;overflow:hidden;direction:rtl}
#intro::before{content:"";position:absolute;inset:0;background:radial-gradient(55% 48% at 50% 52%,#e11d4847 0%,#9f123926 42%,transparent 74%),radial-gradient(42% 32% at 84% 6%,#fb71851f,transparent 70%),radial-gradient(40% 30% at 10% 96%,#f9731614,transparent 70%)}
#intro::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff1f 1px,transparent 1.4px);background-size:26px 26px;-webkit-mask-image:radial-gradient(ellipse 75% 65% at 50% 52%,#000 0%,transparent 100%);mask-image:radial-gradient(ellipse 75% 65% at 50% 52%,#000 0%,transparent 100%);opacity:.5}
#intro>*{position:absolute;z-index:1}
.in-rings{inset:0;width:100%;height:100%;pointer-events:none;opacity:0;transition:opacity .8s}
.in-rings ellipse{fill:none;stroke:#ffb4bd26;stroke-width:1}
.in-top{top:max(22px,4.5vh);left:16px;right:16px;text-align:center}
.in-brand{height:52px}
.in-status{font-size:clamp(17px,2.1vw,25px);font-weight:500;color:#fff;min-height:1.5em}
.in-counter{display:inline-flex;align-items:baseline;gap:8px;font-size:12px;color:#e0b4ba;margin-top:10px;opacity:0;border:1px solid #ffb4bd33;border-radius:999px;padding:3px 14px;background:#ffb4bd0f}
.in-counter b{color:var(--accent);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.in-abs{left:0;top:0}
.in-photo{border-radius:22px;overflow:hidden;background:#fff;border:1px solid #ffffff38;box-shadow:0 0 0 6px #ffb4bd14,0 30px 80px -10px #0a0204,0 0 130px #e11d4859;display:grid;place-items:center;font-size:48px;color:#52525b;opacity:0}
.in-photo img{width:100%;height:100%;object-fit:contain;display:block;padding:8%}
.in-scan{position:absolute;left:0;right:0;top:0;height:26%;background:linear-gradient(#ffd9b300,#ffd9b366);border-bottom:1px solid #fff3e6;opacity:0}
.in-tag{background:#2a0a13d9;color:#fff;border:1px solid #ffffff26;border-radius:999px;padding:5px 13px;font-weight:500;font-size:clamp(11px,1.2vw,14px);white-space:nowrap;box-shadow:0 10px 30px #000a;backdrop-filter:blur(8px);opacity:0}
.in-tile{border-radius:9px;background:#2a0a13;border:1px solid #ffb4bd33;display:grid;place-items:center;overflow:hidden;font-weight:500;text-align:center;line-height:1.2;padding:4px;color:#d9d9de;opacity:0;box-shadow:0 8px 22px -6px #000c}
.in-tile span{overflow:hidden;max-height:100%;overflow-wrap:anywhere}
.in-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:2px}
.in-tile.ok{border-color:#fff;box-shadow:0 0 0 1px #fff,0 0 36px #ffd9b399;color:#fff}
.in-tile.no{border-color:#fb923c80}




.in-more{font-size:12px;color:#8b8b93;opacity:0;white-space:nowrap}
.in-card{background:#fff;color:var(--ink);border-radius:15px;padding:6px 6px 11px;text-align:center;box-shadow:0 30px 60px -18px #000;opacity:0}
.in-card.win{box-shadow:0 0 0 3px #fff,0 0 80px #ffd9b38c,0 30px 60px -18px #000}
.in-card .im{position:relative;background:var(--well);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;font-size:12px;font-weight:700;color:var(--muted);padding:6px}
.in-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:9%}
.in-card small{display:block;font-size:11px;color:var(--muted);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.in-card b{display:block;font-size:clamp(15px,1.8vw,21px);font-weight:700;direction:ltr}
.in-hero{left:12px;right:12px;text-align:center;opacity:0}
.in-hero .num{font-size:clamp(84px,min(18vw,30vh),230px);font-weight:900;line-height:.95;direction:ltr;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff 20%,var(--accent) 95%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .08em}
.in-hero .num.money{font-size:clamp(68px,min(15vw,27vh),200px)}
.in-hero .lbl{font-size:clamp(19px,2.9vw,36px);font-weight:700;margin-top:10px}
.in-hero .sub{font-size:clamp(12px,1.4vw,16px);color:#d9a7ae;margin-top:10px}
.in-skip{bottom:20px;left:20px;border:1px solid #ffffff24;color:#a1a1aa;border-radius:999px;padding:6px 14px;font-size:12px;background:#ffffff08}
.in-skip:hover{color:#fff;border-color:#ffffff59}
.in-snd{bottom:20px;right:20px;border:1px solid #ffffff24;color:#a1a1aa;border-radius:999px;padding:6px 14px;font-size:12px;background:#ffffff08}
.in-snd.off{color:#fff;border-color:#ffffff73;background:#ffffff1f}
.in-snd:hover{color:#fff;border-color:#ffffff59}
.in-sig{display:flex;flex-direction:column;align-items:center;gap:8px;opacity:0;transform-origin:50% 50%}

.in-sig .hd{font-size:34px;font-weight:800;color:#fff;direction:ltr;white-space:nowrap}
.pick-ribbon{position:relative;overflow:hidden}
.pick-ribbon::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 38%,#ffffff59 50%,transparent 62%);transform:translateX(-130%);animation:sheen 6s ease-in-out 2s infinite}
@keyframes sheen{0%{transform:translateX(-130%)}22%,100%{transform:translateX(130%)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes enter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:900px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.top{grid-template-columns:minmax(0,1fr) 220px;gap:28px}}
@media(max-width:760px){
.wrap,main,.nav{padding-left:18px;padding-right:18px}
.nav{height:56px}.head-btn.film,.mini-tag.date{display:none}.header-actions{gap:12px}
main{padding-top:30px}
.top{grid-template-columns:1fr;gap:26px}
.top-media{order:-1;width:140px;border-radius:16px;padding:6px}.source-img,.top-media .img-missing{border-radius:11px}
h1{margin:16px 0 12px}
.bento{flex-wrap:wrap;margin-top:32px}
.cell{flex:1 1 50%;padding:16px 0 14px;border-inline-start:0;padding-inline-start:0}
.cell:nth-child(n+3){border-top:1px solid var(--line)}
.results-head{margin-top:38px}
.seg{max-width:100%;overflow-x:auto}
.chip{padding:6px 10px;font-size:12px}
.cards{grid-template-columns:1fr;gap:10px}
.card{display:grid;grid-template-columns:118px minmax(0,1fr)}
.pick-ribbon{grid-column:1/-1}
.image-well{aspect-ratio:auto;min-height:170px;margin:6px 6px 6px 0}
.image-well img{width:90%;height:auto;max-height:80%}
.card-body{padding:12px 12px 12px 14px}
.price{font-size:26px;padding-top:10px}.shipping{min-height:0}
.favorite{top:auto;bottom:8px}
footer{flex-direction:column;gap:2px;margin-top:38px}
dialog{padding:20px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<dialog id="modal" aria-labelledby="modal-title"><button class="close" id="modal-close" aria-label="סגירה">✕</button><div id="modal-body"></div></dialog>

<!-- Filled by scripts/build_report.py (or by hand, see references/report-schema.md). -->
<script type="application/json" id="report-data">/*__REPORT_DATA__*/</script>
<script>
(function(){
'use strict';
var raw=document.getElementById('report-data').textContent.trim(),data=null;
try{data=JSON.parse(raw)}catch(e){}
var content=document.getElementById('content');

// All report values are untrusted text from shop pages: build DOM nodes, never HTML strings.
function h(tag,attrs){
  var el=document.createElement(tag),k;
  for(k in attrs||{}){
    var v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')el.className=v;
    else if(k==='text')el.textContent=v;
    else if(k.slice(0,2)==='on')el.addEventListener(k.slice(2),v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c==null||c===false)continue;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}
function str(v){return typeof v==='string'?v:(v==null?'':String(v))}
function safeLink(u){u=str(u).trim();return /^https?:\/\//i.test(u)?u:null}
function safeImg(u){
  u=str(u).trim();
  if(!u)return null;
  if(/^data:image\/(png|jpe?g|webp|gif|avif);base64,/i.test(u))return u;
  if(/^https:\/\//i.test(u))return u;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(u)&&u.indexOf('//')!==0)return u; // relative file next to the report
  return null;
}
var SYM={ILS:'₪',USD:'$',EUR:'€',GBP:'£'};
var CUR_NAME={ILS:'שקלים ₪',USD:'דולר $',EUR:'אירו €',GBP:'ליש״ט £'};
function money(m){
  if(!m||typeof m.amount!=='number'||!isFinite(m.amount))return null;
  var n=m.amount.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(m.amount)?0:2,maximumFractionDigits:2});
  var c=str(m.currency).toUpperCase();
  return SYM[c]?SYM[c]+n:n+' '+c;
}
function ltr(t){return h('span',{class:'ltr',text:t})}
function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(str(d));return m?m[3]+'.'+m[2]+'.'+m[1]:str(d)}
function image(src,alt,cls){
  var s=safeImg(src);
  if(!s)return h('div',{class:'img-missing',role:'img','aria-label':alt},cls==='source-img'?'⌕':'אין תמונה');
  var img=h('img',{src:s,alt:alt,class:cls,loading:'lazy',referrerpolicy:'no-referrer'});
  img.addEventListener('error',function(){img.replaceWith(h('div',{class:'img-missing',role:'img','aria-label':alt},cls==='source-img'?'⌕':'התמונה לא נטענה'))});
  return img;
}
var MATCH={exact:'זהה למקור',similar:'דומה למקור',unconfirmed:'לא אומת'};
var MATCH_LONG={exact:'מוצר זהה',similar:'דומה, לא זהה',unconfirmed:'זהות המוצר לא אומתה'};
var AVAIL={in_stock:['● במלאי בבדיקה','in'],out_of_stock:['● אזל מהמלאי','out'],unknown:['מלאי לא ידוע','unknown']};
function shippingText(o){
  var s=o.shipping||{},t;
  if(s.status==='free')t='משלוח חינם';
  else if(s.status==='known'&&money(s))t='משלוח '+money(s);
  else if(s.status==='unavailable')t='אין משלוח ליעד';
  else t='משלוח לא אומת';
  return str(s.note)?t+' · '+str(s.note):t;
}
function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.add('hidden')},4000)}

if(!data||typeof data!=='object'||!Array.isArray(data.offers)){
  content.appendChild(h('div',{class:'empty'},h('h3',{text:'הדוח עדיין ריק.'}),h('p',{text:'זו תבנית הדוח של ״מצא לי כזה בזול״. הנתונים נכנסים אליה אחרי חיפוש.'})));
  document.querySelector('.top').classList.add('hidden');document.getElementById('bento').classList.add('hidden');
  return;
}

var offers=data.offers.map(function(o,i){o=o||{};o._key=str(o.id||i);return o});
var query=data.query||{},product=data.product||{},pick=data.top_pick||null;
var dateTxt=fmtDate(data.checked_at);
var filter='all',currency='all';

// Saved offers survive a refresh where the host allows localStorage; otherwise they live in memory.
var storeKey='fic:'+str(query.text)+'|'+str(data.checked_at)+'|'+offers.length,saved={};
try{saved=JSON.parse(localStorage.getItem(storeKey))||{}}catch(e){}
function persist(){try{localStorage.setItem(storeKey,JSON.stringify(saved))}catch(e){}}
function savedCount(){return offers.filter(function(o){return saved[o._key]}).length}

// ---- static parts
var tags=document.getElementById('header-tags');
tags.appendChild(h('span',{class:'mini-tag date',text:(data.demo?'דוח לדוגמה · ':'')+'נבדק ב־'+dateTxt}));
document.title=(str(product.title)||str(query.text)||'דוח')+' • מצא לי כזה בזול';
var Q_LABEL={image:'חיפוש לפי תמונה',link:'חיפוש לפי קישור',barcode:'חיפוש לפי ברקוד',text:'החיפוש שלך'};
function staticParts(){
  document.getElementById('eyebrow').textContent=(Q_LABEL[query.input_type]||Q_LABEL.text)+(str(query.text)?': '+str(query.text):'');
  document.getElementById('title').textContent=str(product.title)||str(query.text);
  var sm=data.summary||{};
  document.getElementById('lead').textContent=str(sm.headline)||str(product.subtitle);
  document.getElementById('sublead').textContent=str(sm.text);
  var alt=str(product.image_alt)||str(product.title)||'המוצר שחיפשת';
  document.getElementById('top-media').replaceChildren(image(product.image,alt,'source-img'));

  // numbers row: only what the data proves
  var st=buildTiles(),hd=heroData(st),stats=document.getElementById('bento');
  function cell(n,l){stats.appendChild(h('div',{class:'cell'},h('div',{class:'n',text:n}),h('div',{class:'l',text:l})))}
  var p=pick&&offers.filter(function(o){return o._key===str(pick.offer_id)})[0],pm=p&&(pick.basis==='total'?p.total:p.price);
  if(p&&money(pm))cell(money(pm),(pick.basis==='total'?'הזול ביותר שאומת, כולל משלוח':'המחיר הנמוך שאומת, לפני משלוח')+' · '+str(p.store));
  if(hd.money&&hd.win&&hd.money!==pm)cell(money(hd.money),money(query.reference_price)&&hd.sub.indexOf('שראית')>0?'פחות מהמחיר שראית':'הפער בין הזולה ליקרה');
  if(offers.length)cell(String(st.ok.length),st.ok.length===1?'הצעה שאומתה בדף החנות':'הצעות שאומתו בדף החנות');
  if(st.total>offers.length)cell(String(st.total),'תוצאות נסרקו');
  if(!stats.children.length)stats.classList.add('hidden');
}
document.getElementById('footer-note').textContent=(data.demo?'דוח לדוגמה · ':'')+'המחירים נכונים ל־'+dateTxt;
// ---- cards
function pickLabel(){
  if(!pick)return'';
  return pick.basis==='total'?'הזול ביותר שמצאנו ואימתנו · כולל משלוח':'מחיר המוצר הנמוך ביותר שאומת · משלוח לא אומת';
}
var mixed=offers.some(function(o){return o.match_type!==offers[0].match_type});
function card(o,i){
  var isSaved=!!saved[o._key],isPick=pick&&str(pick.offer_id)===o._key&&o.match_type!=='unconfirmed';
  var mt=MATCH[o.match_type]?o.match_type:'unconfirmed';
  var av=AVAIL[o.availability]||AVAIL.unknown;
  var link=safeLink(o.url),price=money(o.price),total=money(o.total);
  var store=str(o.store)||'חנות';
  var ship=h('div',{class:'shipping'},shippingText(o));
  if(total&&o.shipping&&(o.shipping.status==='known'||o.shipping.status==='free'))ship.insertBefore(h('b',{},'סה״כ עד הבית ',ltr(total)),ship.firstChild);
  return h('article',{class:'card'+(isPick?' pick':''),style:'animation-delay:'+Math.min(i,8)*.05+'s'},
    isPick?h('div',{class:'pick-ribbon',text:pickLabel()}):null,
    h('div',{class:'image-well'},
      (mt!=='exact'||mixed)?h('span',{class:'match '+mt,text:MATCH[mt]}):null,
      h('button',{class:'favorite'+(isSaved?' saved':''),'aria-label':(isSaved?'הסרה מהשמורים: ':'שמירת ההצעה של ')+store,'aria-pressed':String(isSaved),onclick:function(){if(saved[o._key])delete saved[o._key];else saved[o._key]=1;persist();render()}},isSaved?'♥':'♡'),
      image(o.image,(str(o.title)||'מוצר')+' מחנות '+store)),
    h('div',{class:'card-body'},
      h('div',{class:'store'},h('span',{dir:'auto',text:store}),h('span',{class:'avail '+av[1],text:av[0].replace('● ','')})),
      h('h3',{text:str(o.title)||'מוצר'}),
      o.spec?h('div',{class:'spec',text:str(o.spec)}):null,
      price?h('div',{class:'price',text:price}):h('div',{class:'price none',text:'מחיר לא אומת'}),
      ship,
      h('div',{class:'card-actions'},
        link?h('a',{class:'shop',href:link,target:'_blank',rel:'noopener noreferrer',text:'לחנות ↖'}):h('span',{class:'shop',style:'opacity:.4',text:'אין קישור'}),
        h('button',{class:'detail','aria-label':'פרטים על ההצעה של '+store,onclick:function(){details(o)}},'פרטים'))));
}
function noticeText(){
  var curs={},anyTotal=false;
  offers.forEach(function(o){if(o.price&&o.price.currency)curs[str(o.price.currency).toUpperCase()]=1;if(money(o.total))anyTotal=true});
  var t=[];
  if(Object.keys(curs).length>1)t.push('המחירים מוצגים במטבע המקורי, בלי המרה.');
  if(!pick&&offers.length)t.push(anyTotal?'לא סומנה אפשרות זולה ביותר: אין בסיס מלא להשוואה בין כל ההצעות.':'לא סומנה אפשרות זולה ביותר: המחיר הסופי עד הבית עדיין לא ידוע.');
  t.push('המחירים נכונים ל־'+dateTxt+' ועשויים להשתנות. בודקים מחיר, משלוח ומלאי בחנות לפני שקונים.');
  var as=(Array.isArray(query.assumptions)?query.assumptions:[]).map(str).filter(Boolean);if(as.length)t.push('החיפוש הניח: '+as.join(', ')+'.');
  (Array.isArray(data.notes)?data.notes:[]).forEach(function(n){t.push(str(n))});
  return t.join(' ');
}
var EMPTY={
  exact:['עדיין לא מצאנו תאום מושלם.','תגית המוצר, הדגם או המידה יעזרו לזהות את המוצר המדויק.'],
  similar:['אין כאן חלופות דומות.','כל מה שנמצא מופיע תחת ״כל האפשרויות״.'],
  unconfirmed:['אין כאן הצעות לא מאומתות.',''],
  saved:['עוד לא שמרת כלום.','לוחצים על הלב בכרטיס כדי לשמור הצעה.'],
  all:['אין הצעות במטבע הזה.','אפשר לשנות את סינון המטבע.']
};
function render(){
  var has={};offers.forEach(function(o){has[MATCH[o.match_type]?o.match_type:'unconfirmed']=1});
  var items=offers.filter(function(o){
    var mt=MATCH[o.match_type]?o.match_type:'unconfirmed';
    if(filter==='saved'&&!saved[o._key])return false;
    if(filter!=='all'&&filter!=='saved'&&mt!==filter)return false;
    return currency==='all'||(o.price&&str(o.price.currency).toUpperCase()===currency);
  });
  var chips=[['all','כל האפשרויות'],['exact','זהה בדיוק']];
  if(has.similar&&(has.exact||has.unconfirmed))chips.push(['similar','דומים']);
  if(has.unconfirmed)chips.push(['unconfirmed','לא אומתו']);
  var sc=savedCount();chips.push(['saved','שמורים'+(sc?' '+sc:'')]);
  var seg=h('div',{class:'seg',role:'group','aria-label':'סינון הצעות'});
  chips.forEach(function(c){seg.appendChild(h('button',{class:'chip'+(filter===c[0]?' active':''),'aria-pressed':String(filter===c[0]),onclick:function(){filter=c[0];render()},text:c[1]}))});
  var fl=h('div',{class:'filters'},seg);
  var curs=[];offers.forEach(function(o){var c=o.price&&str(o.price.currency).toUpperCase();if(c&&curs.indexOf(c)<0)curs.push(c)});
  if(curs.length>1){
    var sel=h('select',{'aria-label':'סינון לפי מטבע',onchange:function(){currency=sel.value;render()}},h('option',{value:'all',text:'כל המטבעות'}));
    curs.forEach(function(c){sel.appendChild(h('option',{value:c,selected:currency===c,text:CUR_NAME[c]||c}))});
    fl.appendChild(sel);
  }
  var cards=h('div',{class:'cards'});
  if(items.length)items.forEach(function(o,i){cards.appendChild(card(o,i))});
  else if(!offers.length)cards.appendChild(h('div',{class:'empty'},h('h3',{text:'לא נמצאו הצעות מאומתות.'}),h('p',{text:'עדיף דוח ריק מדוח מומצא. פרט נוסף כמו דגם, מידה או קישור יעזור בחיפוש הבא.'})));
  else{
    var k=(currency!=='all'&&filter==='all')?'all':filter,e=EMPTY[k]||EMPTY.all;
    cards.appendChild(h('div',{class:'empty'},h('h3',{text:e[0]}),e[1]?h('p',{text:e[1]}):null,
      h('button',{class:'primary',onclick:function(){filter='all';currency='all';render()},text:'בחזרה לכל האפשרויות'})));
  }
  var focusSaved=document.activeElement&&document.activeElement.classList.contains('favorite');
  content.replaceChildren(
    h('div',{class:'results-head'},h('h2',{},'ההצעות ',h('span',{class:'count',text:String(items.length)})),offers.length?fl:null),
    cards,h('p',{class:'notice',text:noticeText()}));
  if(focusSaved){var f=content.querySelector('.favorite');if(f)f.focus()}
}

// ---- details dialog
var modal=document.getElementById('modal');
function row(dl,k,v){if(v==null||v==='')return;dl.appendChild(h('dt',{text:k}));dl.appendChild(typeof v==='string'?h('dd',{text:v}):h('dd',{},v))}
function details(o){
  var mt=MATCH[o.match_type]?o.match_type:'unconfirmed',link=safeLink(o.url),price=money(o.price),total=money(o.total);
  var dl=h('dl');
  row(dl,'מחיר שנצפה',price?ltr(price):'לא אומת');
  row(dl,'משלוח',shippingText(o));
  if(total&&o.shipping&&(o.shipping.status==='known'||o.shipping.status==='free'))row(dl,'סה״כ עד הבית',ltr(total));
  row(dl,'מלאי',(AVAIL[o.availability]||AVAIL.unknown)[0].replace('● ','')+(o.availability_note?' · '+str(o.availability_note):''));
  row(dl,'מצב',str(o.condition));
  row(dl,'אחריות',str(o.warranty));
  row(dl,'נבדק בתאריך',dateTxt+' (לא מחיר חי)');
  var body=h('div',{},
    h('div',{class:'eyebrow'},MATCH_LONG[mt]+' · ',h('span',{dir:'auto',text:str(o.store)})),
    h('h2',{id:'modal-title',text:str(o.title)||'מוצר'}),
    o.match_reason?h('p',{text:str(o.match_reason)}):null,
    o.differences?h('p',{},h('b',{text:'מה שונה: '}),str(o.differences)):null,
    dl);
  if(Array.isArray(o.evidence)&&o.evidence.length){
    var ul=h('ul');o.evidence.forEach(function(e){ul.appendChild(h('li',{text:str(e)}))});
    body.appendChild(h('p',{style:'margin-bottom:0'},h('b',{text:'מה ראינו בדף החנות:'})));body.appendChild(ul);
  }
  if(link)body.appendChild(h('a',{class:'primary',href:link,target:'_blank',rel:'noopener noreferrer',text:'לבדיקת המחיר העדכני בחנות ↖'}));
  document.getElementById('modal-body').replaceChildren(body);
  if(modal.showModal)modal.showModal();else modal.setAttribute('open','');
}
document.getElementById('modal-close').addEventListener('click',function(){modal.close()});
modal.addEventListener('click',function(e){if(e.target===modal)modal.close()});

function buildTiles(){
  var ok=[],no=[];
  offers.forEach(function(o){
    if(o.match_type!=='unconfirmed'&&money(o.price))ok.push({name:str(o.store),ok:true,offer:o,image:o.image});
    else no.push({name:str(o.store),ok:false,why:'unverified',image:o.image});
  });
  (Array.isArray(data.rejected)?data.rejected:[]).forEach(function(r){if(r&&r.store)no.push({name:str(r.store),ok:false,why:WHY[r.why]?r.why:'other',image:r.image})});
  var total=ok.length+no.length,all=[],i=0,j=0;
  no=no.slice(0,Math.max(0,140-ok.length));
  // spread the verified ones evenly through the crowd
  var step=(no.length+ok.length)/Math.max(1,ok.length);
  for(var k=0;k<no.length+ok.length;k++){if(i<ok.length&&k>=Math.floor(i*step))all.push(ok[i++]);else if(j<no.length)all.push(no[j++]);else all.push(ok[i++])}

  no.forEach(function(t){if(!bins[t.why]){bins[t.why]={why:t.why,tiles:[]};order.push(bins[t.why])}bins[t.why].tiles.push(t)});
  order.sort(function(a,b){return b.tiles.length-a.tiles.length});

function heroData(st){

        return{money:{amount:Math.round((ref.amount-m.amount)*100)/100,currency:m.currency},lbl:'פחות',sub:'מול המחיר שראית, '+money(ref)+tail+' · '+str(p.store),win:p};
      // same exact product, cheapest verified shop against the most expensive verified shop
      var top=0;
      if(p.match_type==='exact')offers.forEach(function(o){var v=o[f];if(o.match_type==='exact'&&o.availability!=='out_of_stock'&&money(v)&&v.currency===m.currency&&v.amount>top)top=v.amount});
